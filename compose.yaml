name: threi

# ---------------------------------------------------------------------------
# threi — production-oriented Compose stack
#
# Only Nginx publishes a host port. PostgreSQL and Redis live on an internal
# network and are not reachable from outside the Compose project.
# Copy .env.example to .env and replace every placeholder before deploying.
# ---------------------------------------------------------------------------

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17.11-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-threi}
      POSTGRES_USER: ${POSTGRES_USER:-threi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4.11-alpine3.21
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    command:
      - sh
      - -c
      - |
        exec redis-server \
          --requirepass "$$REDIS_PASSWORD" \
          --appendonly yes \
          --appendfsync everysec \
          --save "" \
          --maxmemory "${REDIS_MAXMEMORY:-256mb}" \
          --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  migrate:
    image: threi-api:${IMAGE_TAG:-0.1.0}
    restart: "no"
    command: ["/app/migrate"]
    environment:
      # The migrator intentionally receives only database settings.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-5}
      DATABASE_MIN_CONNECTIONS: "0"
      DATABASE_ACQUIRE_TIMEOUT_SECS: ${DATABASE_ACQUIRE_TIMEOUT_SECS:-5}
      DATABASE_CONNECT_TIMEOUT_SECS: ${DATABASE_CONNECT_TIMEOUT_SECS:-5}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  api:
    image: threi-api:${IMAGE_TAG:-0.1.0}
    build:
      context: ./services/api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      API_HOST: 0.0.0.0
      API_PORT: "8080"
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-10}
      DATABASE_MIN_CONNECTIONS: ${DATABASE_MIN_CONNECTIONS:-1}
      DATABASE_ACQUIRE_TIMEOUT_SECS: ${DATABASE_ACQUIRE_TIMEOUT_SECS:-5}
      DATABASE_CONNECT_TIMEOUT_SECS: ${DATABASE_CONNECT_TIMEOUT_SECS:-5}
      # The password must be URL-safe (or percent-encoded) inside REDIS_URL.
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379/0
      REDIS_REQUIRED: ${REDIS_REQUIRED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      WEB_URL: ${SITE_URL:?SITE_URL must be set}
      STEAM_RETURN_URL: ${SITE_URL:?SITE_URL must be set}/api/v1/auth/steam/callback
      STEAM_REALM: ${SITE_URL:?SITE_URL must be set}
      STEAM_COMMUNITY_BASE_URL: ${STEAM_COMMUNITY_BASE_URL:-https://steamcommunity.com}
      STEAM_COMMUNITY_IP: ${STEAM_COMMUNITY_IP:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      ADMIN_STEAM_IDS: ${ADMIN_STEAM_IDS:-}
      # Optional RCON liveness fallback for empty/hibernating servers. The
      # password itself is stored per server from the admin panel, not here.
      HIBERNATION_POLL_ENABLED: ${HIBERNATION_POLL_ENABLED:-true}
      HIBERNATION_POLL_SCAN_INTERVAL_SECS: ${HIBERNATION_POLL_SCAN_INTERVAL_SECS:-30}
      HIBERNATION_POLL_INTERVAL_SECS: ${HIBERNATION_POLL_INTERVAL_SECS:-60}
      HIBERNATION_POLL_AFTER_SECS: ${HIBERNATION_POLL_AFTER_SECS:-90}
      HIBERNATION_RCON_TIMEOUT_SECS: ${HIBERNATION_RCON_TIMEOUT_SECS:-5}
      REQUEST_TIMEOUT_SECS: ${REQUEST_TIMEOUT_SECS:-30}
      REQUEST_BODY_LIMIT_BYTES: ${REQUEST_BODY_LIMIT_BYTES:-1048576}
      LOG_JSON: ${LOG_JSON:-true}
      RUST_LOG: ${RUST_LOG:-info}
    networks:
      - internal
      - edge
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  web:
    image: threi-web:${IMAGE_TAG:-0.1.0}
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost}
        # Available to the Next.js server for the local same-origin rewrite.
        API_INTERNAL_URL: http://api:8080
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:8080
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    init: true
    stop_grace_period: 30s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx/nginx-unprivileged:1.30.6-alpine3.24
    restart: unless-stopped
    ports:
      # Only the reverse proxy is published. Set HTTP_BIND=0.0.0.0 only when
      # the host firewall / cloud security group is configured accordingly.
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-80}:8080"
    environment:
      SERVER_NAME: ${SERVER_NAME:-_}
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - edge
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/nginx-health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

networks:
  # Public-facing traffic: Nginx, web and API only.
  edge:
    driver: bridge
  # Data plane: PostgreSQL and Redis are never attached to the edge network.
  internal:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
