[package]
name = "threi-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "threi community API (Axum modular monolith)"
license = "UNLICENSED"
publish = false

[dependencies]
axum = "0.8.9"
dotenvy = "0.15.7"
redis = { version = "1.8.0", default-features = false, features = ["connection-manager", "tokio-comp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-webpki"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "limit", "set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "time"] }
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["axum", "vendored"] }
uuid = { version = "1.29.0", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
